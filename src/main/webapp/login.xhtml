<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html" xmlns:c="http://java.sun.com/jsp/jstl/core">

<h:head>
   <title>Guayabal SiSDE :: Autenticaci&oacute;n</title>
   <link rel="icon" type="image/png" href="#{request.contextPath}/resources/images/logo1.svg"/>
   <link rel="stylesheet" href="#{request.contextPath}/resources/css/materialdesignicons.min.css"/>
   <link rel="stylesheet" href="#{request.contextPath}/resources/css/vendor.bundle.base.css"/>
   <link rel="stylesheet" href="#{request.contextPath}/resources/css/style.css"/>
   <link rel="stylesheet" href="#{request.contextPath}/resources/css/bootstrap.min.css"/>
   <link rel="stylesheet" href="#{request.contextPath}/resources/css/login.css"/>
</h:head>

<h:body>
   <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
         <div class="content-wrapper d-flex auth auth-img-bg px-0">
            <div class="row w-100 mx-0">

               <!-- Columna izquierda: foto de la finca, oculta en movil -->
               <div class="col-lg-6 login-half-bg d-none d-lg-flex align-items-center justify-content-center">
                  <div class="login-bg-text">
                     <h1>SGPA</h1>
                     <p>Sistema de gesti&oacute;n de la producci&oacute;n agr&iacute;cola en la granja &#8220;El Guayabal&#8221;</p>
                  </div>
               </div>

               <!-- Columna derecha: formulario -->
               <div class="col-lg-6 d-flex align-items-center justify-content-center">
                  <div class="auth-form-light text-left py-5 px-4 px-sm-5" style="width:100%;max-width:460px;border-radius:8px;">

                     <div class="brand-logo text-center mb-2">
                        <img src="#{request.contextPath}/resources/images/logo1.svg" alt="SGPA"/>
                     </div>

                     <h4 class="mb-1">Bienvenido</h4>
                     <h6 class="font-weight-light text-muted mb-4">Inicia sesi&oacute;n para continuar.</h6>

                     <c:if test="${SPRING_SECURITY_LAST_EXCEPTION != null}">
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                           <strong>Atenci&oacute;n! </strong>
                           <h:outputText value="#{templateBean.translateMessage(SPRING_SECURITY_LAST_EXCEPTION.message)}"/>
                        </div>
                     </c:if>

                     <form id="loginForm" method="post" action="#{request.contextPath}/login" role="form">

                        <div class="form-group">
                           <label for="username">Usuario</label>
                           <div class="input-group">
                              <div class="input-group-prepend">
                                 <span class="input-group-text"><i class="mdi mdi-account-outline"></i></span>
                              </div>
                              <input id="username" name="username" type="text"
                                     class="form-control form-control-lg"
                                     placeholder="Tu usuario"
                                     required="required"
                                     autocomplete="username"/>
                           </div>
                        </div>

                        <div class="form-group">
                           <label for="password">Contrase&ntilde;a</label>
                           <div class="input-group">
                              <div class="input-group-prepend">
                                 <span class="input-group-text"><i class="mdi mdi-lock-outline"></i></span>
                              </div>
                              <input id="password" name="password" type="password"
                                     class="form-control form-control-lg"
                                     placeholder="Tu contrase&#241;a"
                                     required="required"
                                     autocomplete="current-password"/>
                              <div class="input-group-append">
                                 <button type="button" class="password-toggle-btn"
                                         id="togglePassword"
                                         aria-label="Mostrar u ocultar contrase&#241;a">
                                    <i class="mdi mdi-eye-outline" id="togglePasswordIcon"></i>
                                 </button>
                              </div>
                           </div>
                        </div>

                        <div class="mt-3">
                           <button type="submit" class="btn btn-primary btn-block btn-lg auth-form-btn">
                              Autenticar
                           </button>
                        </div>

                        <input type="hidden"
                               name="${_csrf.parameterName}"
                               value="${_csrf.token}"/>

                     </form>

                     <div class="text-center mt-4">
                        <small class="text-muted">
                           &#169; Todos los derechos reservados.
                           <a href="https://www.unah.edu.cu/" target="_blank">UNAH</a>
                        </small>
                     </div>

                  </div>
               </div>

            </div>
         </div>
      </div>
   </div>

   <script>
      (function () {
         var btn = document.getElementById('togglePassword');
         var input = document.getElementById('password');
         var icon = document.getElementById('togglePasswordIcon');
         if (btn) {
            btn.addEventListener('click', function () {
               var show = input.getAttribute('type') === 'password';
               input.setAttribute('type', show ? 'text' : 'password');
               icon.className = show ? 'mdi mdi-eye-off-outline' : 'mdi mdi-eye-outline';
            });
         }
      })();
   </script>
</h:body>
</html>
