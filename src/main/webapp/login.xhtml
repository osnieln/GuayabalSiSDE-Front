<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html" xmlns:c="http://java.sun.com/jsp/jstl/core">

<h:head>
   <title>Guayabal SiSDE :: Autenticaci&oacute;n</title>
   <link rel="stylesheet" href="#{request.contextPath}/resources/css/login-style.css"/>
</h:head>

<h:body>
   <hgroup>
      <h1>SiSDE</h1>
      <h3>Sistema para el manejo inteligente y sostenible de tierras</h3>
   </hgroup>
   <form id="loginForm" method="post" action="#{request.contextPath}/login" role="form">
      <c:if test="${SPRING_SECURITY_LAST_EXCEPTION != null}">
         <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Atenci&oacute;n! </strong> <h:outputText
                 value="#{templateBean.translateMessage(SPRING_SECURITY_LAST_EXCEPTION.message)}"/>
         </div>
         <br/>
      </c:if>

      <div class="group">
         <input id="username" name="username" required="true" type="text"><span class="highlight"></span><span class="bar"></span> </input>
         <label>Usuario</label>
      </div>
      <div class="group">
         <input type="password" id="password" name="password" required="true"><span class="highlight"></span><span class="bar"></span> </input>
         <label>Contrase&ntilde;a</label>
      </div>
      <button type="submit" class="button buttonBlue">Autenticar
         <div class="ripples buttonRipples"><span class="ripplesCircle"></span></div>
      </button>

      <input type="hidden"
             name="${_csrf.parameterName}"
             value="${_csrf.token}"/>
   </form>
   <footer><a href="http://www.polymer-project.org/" target="_blank"><img src="https://www.polymer-project.org/images/logos/p-logo.svg"/></a>
      <p>&copy; Todos los derechos reservados. <a href="https://www.unah.edu.cu/" target="_blank">UNAH</a></p>
   </footer>

   <h:outputScript library="js" name="login-style.js"/>
</h:body>
</html>
