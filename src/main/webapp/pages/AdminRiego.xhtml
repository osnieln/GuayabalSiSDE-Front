<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

<h:head><title>Planificación de Riego</title></h:head>

<h:body>
    <ui:composition template="template.xhtml">

        <ui:define name="title">Planificaci&oacute;n de Riego</ui:define>

        <ui:define name="content">
            #{adminRiegoBean.init()}
            <h:form id="form">
                <p:growl id="messages" showDetail="true"/>

                <p:toolbar>
                    <p:toolbarGroup align="right">
                        <p:commandButton value="Adicionar" icon="pi pi-plus"
                                         update=":dialogs:add-riego-content"
                                         oncomplete="PF('addRiegoDialog').show()"
                                         styleClass="ui-button-success" style="margin-right:.5rem">
                            <p:resetInput target=":dialogs:add-riego-content"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable tableStyleClass="table-striped" id="dt-riego" widgetVar="dtRiego"
                             var="riego" value="#{adminRiegoBean.listRiego}"
                             size="small" reflow="true"
                             rowKey="#{riego.id}" paginator="true" rows="10"
                             paginatorPosition="bottom"
                             emptyMessage="No hay riegos planificados.">
                    <f:facet name="header">
                        <span class="ui-input-icon-left">
                            <i class="pi pi-search"/>
                            <p:inputText onkeyup="PF('dtRiego').filter()" placeholder="Buscar..."/>
                        </span>
                    </f:facet>

                    <p:column headerText="ID" sortBy="#{riego.id}" style="width:60px;">
                        <h:outputText value="#{riego.id}"/>
                    </p:column>

                    <p:column headerText="&Aacute;rea ID" sortBy="#{riego.areaCultivoResponsePk.areaId}">
                        <h:outputText value="#{riego.areaCultivoResponsePk.areaId}"/>
                    </p:column>

                    <p:column headerText="Cultivo ID" sortBy="#{riego.areaCultivoResponsePk.cultivoId}">
                        <h:outputText value="#{riego.areaCultivoResponsePk.cultivoId}"/>
                    </p:column>

                    <p:column headerText="Fecha Siembra">
                        <h:outputText value="#{riego.areaCultivoResponsePk.fechaSiembra}"/>
                    </p:column>

                    <p:column headerText="Fecha Planificada" sortBy="#{riego.fechaPlanificacion}">
                        <h:outputText value="#{riego.fechaPlanificacion}"/>
                    </p:column>

                    <p:column headerText="Fecha Real">
                        <h:outputText value="#{not empty riego.fechaReal ? riego.fechaReal : '—'}"/>
                    </p:column>

                    <p:column headerText="Estado" style="text-align:center;">
                        <h:outputText value="Realizado"
                                      rendered="#{not empty riego.fechaReal}"
                                      style="background-color:#d4edda;color:#155724;padding:3px 10px;border-radius:12px;font-size:0.82rem;font-weight:600;"/>
                        <h:outputText value="Pendiente"
                                      rendered="#{empty riego.fechaReal}"
                                      style="background-color:#fff3cd;color:#856404;padding:3px 10px;border-radius:12px;font-size:0.82rem;font-weight:600;"/>
                    </p:column>

                    <p:column headerText="Advertencia">
                        <h:outputText value="#{not empty riego.advertencia ? riego.advertencia : '—'}"
                                      style="#{not empty riego.advertencia ? 'color:#dc3545;font-weight:600;' : 'color:#6c757d;'}"/>
                    </p:column>

                    <p:column exportable="false" style="width:110px; text-align:center;">
                        <p:commandButton icon="pi pi-pencil"
                                         styleClass="edit-button rounded-button ui-button-warning"
                                         style="margin-right:5px;"
                                         update=":dialogs:edit-riego-content"
                                         oncomplete="PF('editRiegoDialog').show()"
                                         process="@this"
                                         actionListener="#{adminRiegoBean.prepararEdicion(riego)}"
                                         title="Editar">
                            <p:resetInput target=":dialogs:edit-riego-content"/>
                        </p:commandButton>
                        <p:commandButton icon="pi pi-trash"
                                         styleClass="rounded-button ui-button-danger"
                                         oncomplete="PF('deleteRiegoDialog').show()"
                                         process="@this"
                                         actionListener="#{adminRiegoBean.prepararEliminacion(riego)}"
                                         title="Eliminar"/>
                    </p:column>
                </p:dataTable>

                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
            </h:form>

            <h:form id="dialogs">

                <!-- Adicionar Dialog -->
                <p:dialog header="Planificar Riego" showEffect="fade" modal="true"
                          widgetVar="addRiegoDialog" responsive="true" style="width:480px;">
                    <p:outputPanel id="add-riego-content" class="ui-fluid">
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-areaId" value="ID del &Aacute;rea"/><br/>
                                <p:inputNumber id="add-areaId" value="#{adminRiegoBean.areaId}"
                                               decimalPlaces="0" thousandSeparator=""
                                               style="width:100%;" placeholder="Ej: 1"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-cultivoId" value="ID del Cultivo"/><br/>
                                <p:inputNumber id="add-cultivoId" value="#{adminRiegoBean.cultivoId}"
                                               decimalPlaces="0" thousandSeparator=""
                                               style="width:100%;" placeholder="Ej: 1"/>
                            </div>
                        </div>
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-12">
                                <p:outputLabel for="add-fechaSiembra" value="Fecha de Siembra (yyyy-MM-dd)"/><br/>
                                <p:inputText id="add-fechaSiembra" value="#{adminRiegoBean.fechaSiembra}"
                                             style="width:100%;" placeholder="yyyy-MM-dd"/>
                            </div>
                        </div>
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-fechaPlan" value="Fecha Planificada (yyyy-MM-dd)"/><br/>
                                <p:inputText id="add-fechaPlan" value="#{adminRiegoBean.fechaPlanificacion}"
                                             style="width:100%;" placeholder="yyyy-MM-dd"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-fechaReal" value="Fecha Real (opcional)"/><br/>
                                <p:inputText id="add-fechaReal" value="#{adminRiegoBean.fechaReal}"
                                             style="width:100%;" placeholder="yyyy-MM-dd"/>
                            </div>
                        </div>
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-12">
                                <p:outputLabel for="add-advertencia" value="Advertencia (opcional)"/><br/>
                                <p:inputTextarea id="add-advertencia" value="#{adminRiegoBean.advertencia}"
                                                 style="width:100%; height:60px;" placeholder="Observaciones...">
                                    <f:validateLength maximum="500"/>
                                </p:inputTextarea>
                            </div>
                        </div>
                    </p:outputPanel>
                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         actionListener="#{adminRiegoBean.addRiego()}"
                                         update="add-riego-content form:messages"
                                         process="add-riego-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" type="button"
                                         onclick="PF('addRiegoDialog').hide()"
                                         styleClass="ui-button-secondary"/>
                    </f:facet>
                </p:dialog>

                <!-- Editar Dialog -->
                <p:dialog header="Editar Riego" showEffect="fade" modal="true"
                          widgetVar="editRiegoDialog" responsive="true" style="width:480px;">
                    <p:outputPanel id="edit-riego-content" class="ui-fluid">
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-12">
                                <p:outputLabel value="ID:"/><br/>
                                <p:inputText value="#{adminRiegoBean.selectedRiego.id}"
                                             style="width:100%;" disabled="true"/>
                            </div>
                        </div>
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-areaId" value="ID del &Aacute;rea"/><br/>
                                <p:inputNumber id="edit-areaId" value="#{adminRiegoBean.areaId}"
                                               decimalPlaces="0" thousandSeparator=""
                                               style="width:100%;"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-cultivoId" value="ID del Cultivo"/><br/>
                                <p:inputNumber id="edit-cultivoId" value="#{adminRiegoBean.cultivoId}"
                                               decimalPlaces="0" thousandSeparator=""
                                               style="width:100%;"/>
                            </div>
                        </div>
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-12">
                                <p:outputLabel for="edit-fechaSiembra" value="Fecha de Siembra (yyyy-MM-dd)"/><br/>
                                <p:inputText id="edit-fechaSiembra" value="#{adminRiegoBean.fechaSiembra}"
                                             style="width:100%;"/>
                            </div>
                        </div>
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-fechaPlan" value="Fecha Planificada (yyyy-MM-dd)"/><br/>
                                <p:inputText id="edit-fechaPlan" value="#{adminRiegoBean.fechaPlanificacion}"
                                             style="width:100%;"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-fechaReal" value="Fecha Real (opcional)"/><br/>
                                <p:inputText id="edit-fechaReal" value="#{adminRiegoBean.fechaReal}"
                                             style="width:100%;"/>
                            </div>
                        </div>
                        <div class="row" style="margin-bottom:10px;">
                            <div class="col col-sm-12">
                                <p:outputLabel for="edit-advertencia" value="Advertencia (opcional)"/><br/>
                                <p:inputTextarea id="edit-advertencia" value="#{adminRiegoBean.advertencia}"
                                                 style="width:100%; height:60px;">
                                    <f:validateLength maximum="500"/>
                                </p:inputTextarea>
                            </div>
                        </div>
                    </p:outputPanel>
                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         actionListener="#{adminRiegoBean.editRiego()}"
                                         update="edit-riego-content form:messages"
                                         process="edit-riego-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" type="button"
                                         onclick="PF('editRiegoDialog').hide()"
                                         styleClass="ui-button-secondary"/>
                    </f:facet>
                </p:dialog>

                <!-- Eliminar Dialog -->
                <p:confirmDialog widgetVar="deleteRiegoDialog" showEffect="fade" width="300"
                                 message="&iquest;Desea eliminar este riego planificado?"
                                 header="Confirmar" severity="warn">
                    <p:commandButton value="S&iacute;" icon="pi pi-check"
                                     actionListener="#{adminRiegoBean.deleteRiego()}"
                                     process="@this" styleClass="ui-button-danger"/>
                    <p:commandButton value="No" type="button" icon="pi pi-times"
                                     styleClass="ui-button-secondary"
                                     onclick="PF('deleteRiegoDialog').hide()"/>
                </p:confirmDialog>

                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
            </h:form>

        </ui:define>
    </ui:composition>
</h:body>
</html>
