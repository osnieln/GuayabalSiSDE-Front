<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core">

<h:head>
    <title>Title</title>
</h:head>

<h:body>

    <ui:composition template="template.xhtml">

        <ui:define name="title">
            Administrar Espacial
        </ui:define>

        <ui:define name="content">
            #{adminAreaCultivo.init()}
            <h:form id="form">
                <p:growl id="messages" showDetail="true" escape="false"/>

                <p:toolbar>
                    <p:toolbarGroup align="right">
                        <p:commandButton value="Adicionar" icon="pi pi-plus"
                                         update=":dialogs:add-areaCultivo-content"
                                         actionListener="#{adminAreaCultivo.initAddAreaCultivo()}"
                                         oncomplete="PF('addareaCultivoDialog').show()"
                                         styleClass="ui-button-success" style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:add-areaCultivo-content"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable tableStyleClass="table-striped" id="dt-areaCultivo" widgetVar="dtareaCultivo"
                             var="areaCultivo"
                             value="#{adminAreaCultivo.listAreaCultivo}" size="small"
                             reflow="true"
                             rowKey="#{areaCultivo.descripcion}" paginator="true" rows="10"
                             paginatorPosition="bottom">
                    <f:facet name="header">
                        <div class="areaCultivo-table-header">
                        <span class="filter-container ui-input-icon-left"> <i class="pi pi-search"></i>
                        <p:inputText id="globalFilter" onkeyup="PF('dtareaCultivo').filter()" placeholder="Buscar"/>
                    </span>
                        </div>
                    </f:facet>
                    <p:column exportHeaderValue="Area" headerText="Area"
                              filterBy="#{adminAreaCultivo.findAreaById(areaCultivo.areaCultivoResponsePK.areaId).descripcion}"
                              sortOrder="#{adminAreaCultivo.findAreaById(areaCultivo.areaCultivoResponsePK.areaId).descripcion}">
                        <h:outputText
                                value="#{adminAreaCultivo.findAreaById(areaCultivo.areaCultivoResponsePK.areaId).descripcion}"/>
                    </p:column>
                    <p:column exportHeaderValue="Cultivo" headerText="Cultivo"
                              filterBy="#{adminAreaCultivo.findCultivoById(areaCultivo.areaCultivoResponsePK.cultivoId).descripcion}">
                        <h:outputText
                                value="#{adminAreaCultivo.findCultivoById(areaCultivo.areaCultivoResponsePK.cultivoId).descripcion}"/>
                    </p:column>
                    <p:column exportHeaderValue="Fecha de siembra" headerText="Fecha de siembra" sortOrder="asc"
                              filterBy="#{areaCultivo.areaCultivoResponsePK.fechaSiembra}">
                        <h:outputText value="#{areaCultivo.areaCultivoResponsePK.fechaSiembra}"/>
                    </p:column>
                    <p:column exportHeaderValue="Fecha de recogida" headerText="Fecha de recogida"
                              filterBy="#{areaCultivo.fechaRecogida}">
                        <h:outputText value="#{areaCultivo.fechaRecogida}"/>
                    </p:column>
                    <p:column exportHeaderValue="Plan de producción" headerText="Plan de producci&oacute;n"
                              filterBy="#{areaCultivo.planProd}">
                        <h:outputText value="#{areaCultivo.planProd}"/>
                    </p:column>
                    <p:column exportable="false">
                        <p:commandButton icon="pi pi-info-circle"
                                         oncomplete="PF('infoareaCultivoDialog').show()"
                                         styleClass="rounded-button ui-button-info" process="@this"
                                         actionListener="#{adminAreaCultivo.updateSelectedAreaCultivo(areaCultivo)}"
                                         update=":dialogs:info-areaCultivo-content"
                                         title="Informaci&oacute;n">
                            <p:resetInput target=":dialogs:info-areaCultivo-content"/>
                        </p:commandButton>
                        <p:commandButton icon="pi pi-pencil" update=":dialogs:edit-areaCultivo-content"
                                         style="margin-left: 10px"
                                         oncomplete="PF('editareaCultivoDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-warning" process="@this"
                                         actionListener="#{adminAreaCultivo.updateSelected_AreaCultivo_toEdit(areaCultivo)}">
                            <p:resetInput target=":dialogs:edit-areaCultivo-content"/>
                        </p:commandButton>
                        <p:commandButton icon="pi pi-trash"
                                         oncomplete="PF('deleteAreaCultivoDialog').show()"
                                         style="margin-left: 10px"
                                         styleClass="edit-button rounded-button ui-button-danger" process="@this"
                                         actionListener="#{adminAreaCultivo.updateSelectedAreaCultivoToDelete(areaCultivo)}">
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
                <input type="hidden"
                       name="${_csrf.parameterName}"
                       value="${_csrf.token}"/>
            </h:form>

            <h:form id="dialogs">

                <!--Info Dialog-->
                <p:dialog header="Informaci&oacute;n" showEffect="fade" modal="true"
                          widgetVar="infoareaCultivoDialog"
                          responsive="true" width="800px">
                    <p:outputPanel id="info-areaCultivo-content" class="ui-fluid">
                        <p:outputPanel>
                            <div class="row">
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel value="&Aacute;rea: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.findAreaById(adminAreaCultivo.selectedAreaCultivo.areaCultivoResponsePK.areaId).descripcion}"/>
                                </div>
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel value="Cultivo: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.findCultivoById(adminAreaCultivo.selectedAreaCultivo.areaCultivoResponsePK.cultivoId).descripcion}"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel value="Fecha de siembra: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.selectedAreaCultivo.areaCultivoResponsePK.fechaSiembra}"/>
                                </div>
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel value="Fecha de recogida: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.selectedAreaCultivo.fechaRecogida}"/>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel value="Plan de producci&oacute;n: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.selectedAreaCultivo.planProd}"/>
                                </div>
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel
                                            value="Producci&oacute;n de cultivos permanentes: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.selectedAreaCultivo.prodCultivosPermanente}"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel value="Producci&oacute;n de cultivos temporal: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.selectedAreaCultivo.prodCultivosTemporales}"/>
                                </div>
                                <div class="col col-lg-6">
                                    <strong><h:outputLabel value="Producci&oacute;n real: "/></strong>
                                    <h:outputText
                                            value=" #{adminAreaCultivo.selectedAreaCultivo.produccionReal}"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-lg-12">
                                    <strong><h:outputLabel value="Agroquímicos: "/></strong>
                                    <ui:repeat value="#{adminAreaCultivo.selectedAreaCultivo.agroquimicos}" var="a">
                                        <p:chip label="#{a}" style="margin-left: 5px;"/>
                                    </ui:repeat>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-lg-12">
                                    <strong><h:outputLabel value="Planificación de Riegos: "/></strong>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-lg-12">
                                    <p:timeline id="timeline" value="#{adminAreaCultivo.model}"
                                                selectable="${true}"
                                                zoomable="${true}"
                                                moveable="${true}"
                                                stackEvents="${true}"
                                                eventStyle="box"
                                                showCurrentTime="${true}">
                                        <p:ajax event="select" listener="#{adminAreaCultivo.onSelect}"
                                                update=":form:messages"/>
                                    </p:timeline>
                                </div>
                            </div>
                        </p:outputPanel>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('infoareaCultivoDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>
                <!--/Info Dialog-->

                <!--Add Dialog-->
                <p:dialog header="A&ntilde;adir Espacial" showEffect="fade" modal="true"
                          widgetVar="addareaCultivoDialog" width="1000px" height="600px"
                          responsive="true">
                    <p:outputPanel id="add-areaCultivo-content" class="ui-fluid">
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-area" value="&Aacute;rea: "/><br/>
                                <p:selectOneMenu id="add-area" value="#{adminAreaCultivo.areaSelected}"
                                                 required="true"
                                                 requiredMessage="Debe seleccionar un área.">
                                    <f:selectItem itemLabel="-- Seleccione --" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems itemLabel="${area.descripcion}" itemValue="${area.id}" var="area"
                                                   value="#{adminAreaCultivo.areaResponsesList}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-cultivo" value="Cultivo: "/><br/>
                                <p:selectOneMenu id="add-cultivo" value="#{adminAreaCultivo.cultivoSelected}"
                                                 required="true"
                                                 requiredMessage="Debe seleccionar un cultivo.">
                                    <f:selectItem itemLabel="-- Seleccione --" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems itemLabel="${cul.descripcion}" itemValue="${cul.id}" var="cul"
                                                   value="#{adminAreaCultivo.cultivoList}"/>
                                </p:selectOneMenu>
                            </div>
                        </div>
                        <br/>
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-fechaSiembra" value="Fecha de Siembra: "/><br/>
                                <p:datePicker id="add-fechaSiembra" value="#{adminAreaCultivo.fechaSiembra}"
                                              required="true"
                                              requiredMessage="La fecha de siembra es obligatoria."
                                              showIcon="true"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-fechaRecogida" value="Fecha de Recogida: "/><br/>
                                <p:datePicker id="add-fechaRecogida" value="#{adminAreaCultivo.fechaRecogida}"
                                              required="true"
                                              requiredMessage="La fecha de recogida es obligatoria."
                                              showIcon="true"/>
                            </div>
                        </div>
                        <br/>
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-3">
                                <p:outputLabel for="add-planProduccion" value="Plan de Producción: "/><br/>
                                <p:inputNumber id="add-planProduccion" value="#{adminAreaCultivo.planProduccion}"
                                               required="true"
                                               requiredMessage="El plan de producción es obligatorio."
                                               minValue="0"
                                               modifyValueOnWheel="false"/>
                            </div>
                            <div class="col col-sm-3">
                                <p:outputLabel for="add-planPermanente"
                                               value="Producción de cultivos permanentes: "/><br/>
                                <p:inputNumber id="add-planPermanente" value="#{adminAreaCultivo.prodPermanente}"
                                               minValue="0"
                                               modifyValueOnWheel="false"/>
                            </div>
                            <div class="col col-sm-3">
                                <p:outputLabel for="add-prodTemp" value="Producción de cultivos temporales: "/><br/>
                                <p:inputNumber id="add-prodTemp" value="#{adminAreaCultivo.prodTemporal}"
                                               minValue="0"
                                               modifyValueOnWheel="false"/>
                            </div>
                            <div class="col col-sm-3">
                                <p:outputLabel for="add-prodReal" value="Producción real: "/><br/>
                                <p:inputNumber id="add-prodReal" value="#{adminAreaCultivo.prodReal}"
                                               minValue="0"
                                               modifyValueOnWheel="false"/>
                            </div>
                        </div>
                        <br/>
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-12">
                                <p:outputLabel for="add-pickList" value="Agroquímicos: "/><br/>
                            </div>
                            <div class="col col-sm-12">
                                <p:pickList id="add-pickList" value="#{adminAreaCultivo.agroquimicos}" var="a"
                                            itemLabel="#{a}" itemValue="#{a}"/>
                            </div>
                        </div>
                        <br/>

                        <div class="row">
                            <div class="col col-sm-12">
                                <p:outputLabel for="dt-riego" value="Planificaci&oacute;n de riego: "/>
                            </div>
                            <div class="col col-sm-3">
                                <p:commandButton value="Adicionar" icon="pi pi-plus"
                                                 update=":dialogs:add-riego-content"
                                                 oncomplete="PF('addRiegoDialog').show()"
                                                 styleClass="ui-button-success" style="margin-right: .5rem">
                                    <p:resetInput target=":dialogs:add-riego-content"/>
                                </p:commandButton>
                            </div>

                            <div class="col col-sm-12">
                                <p:dataTable tableStyleClass="table-striped" id="dt-riego" widgetVar="dtriego"
                                             var="riego"
                                             value="#{adminAreaCultivo.riegoResponseList}" size="small"
                                             reflow="true"
                                             paginator="true" rows="5"
                                             paginatorPosition="bottom">
                                    <p:column exportHeaderValue="Planificado" headerText="Planificado">
                                        <h:outputText
                                                value="${riego.fechaPlanificacion}"/>
                                    </p:column>
                                    <p:column exportHeaderValue="Real" headerText="Real">
                                        <h:outputText
                                                value="${riego.fechaReal}"/>
                                    </p:column>
                                    <p:column exportable="false">
                                        <p:commandButton icon="pi pi-pencil" update=":dialogs:edit-riego-content"
                                                         style="margin-left: 10px"
                                                         oncomplete="PF('editRiegoDialog').show()"
                                                         styleClass="edit-button rounded-button ui-button-warning"
                                                         process="@this"
                                                         actionListener="#{adminAreaCultivo.updateSelectedRiegoToEdit(riego)}">
                                            <p:resetInput target=":dialogs:edit-riego-content"/>
                                        </p:commandButton>
                                        <p:commandButton icon="pi pi-trash"
                                                         oncomplete="PF('deleteRiegoDialog').show()"
                                                         style="margin-left: 10px"
                                                         styleClass="edit-button rounded-button ui-button-danger"
                                                         process="@this"
                                                         actionListener="#{adminAreaCultivo.updateSelectedRiegoToDelete(riego)}">
                                        </p:commandButton>
                                    </p:column>

                                </p:dataTable>
                            </div>
                        </div>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         id="btnAddModal" actionListener="#{adminAreaCultivo.addAreaCultivo()}"
                                         update="add-areaCultivo-content :form:messages"
                                         process="add-areaCultivo-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('addareaCultivoDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>
                <!--/Add Dialog-->

                <!--Add Riego Dialog-->
                <p:dialog header="A&ntilde;adir Riego" showEffect="fade" modal="true"
                          widgetVar="addRiegoDialog" width="600px"
                          responsive="true">
                    <p:outputPanel id="add-riego-content" class="ui-fluid">
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-fechaPlanif" value="Fecha planificada: "/><br/>
                                <p:datePicker id="add-fechaPlanif" value="#{adminAreaCultivo.fechaPlanificada}"
                                              required="true"
                                              requiredMessage="La fecha planificada es obligatoria."
                                              showIcon="true"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="add-fechaReal" value="Fecha Real: "/><br/>
                                <p:datePicker id="add-fechaReal" value="#{adminAreaCultivo.fechaReal}"/>
                            </div>
                        </div>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         id="btnAddRiegoModal" actionListener="#{adminAreaCultivo.addRiego()}"
                                         update="add-riego-content :form:messages"
                                         process="add-riego-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('addRiegoDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>

                <!--Edit Riego Dialog-->
                <p:dialog header="Editar Riego" showEffect="fade" modal="true"
                          widgetVar="editRiegoDialog" width="600px"
                          responsive="true">
                    <p:outputPanel id="edit-riego-content" class="ui-fluid">
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-fechaPlanif" value="Fecha planificada: "/><br/>
                                <p:datePicker id="edit-fechaPlanif" value="#{adminAreaCultivo.fechaPlanificada}"
                                              required="true"
                                              requiredMessage="La fecha planificada es obligatoria."
                                              showIcon="true"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-fechaReal" value="Fecha Real: "/><br/>
                                <p:datePicker id="edit-fechaReal" value="#{adminAreaCultivo.fechaReal}"/>
                            </div>
                        </div>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         id="btnEditRiegoModal" actionListener="#{adminAreaCultivo.editRiego()}"
                                         update="edit-riego-content :form:messages"
                                         process="edit-riego-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('editRiegoDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>

                <!--Delete Riego Dialog -->
                <p:confirmDialog widgetVar="deleteRiegoDialog" showEffect="fade" width="300"
                                 message="¿Desea eliminar el Riego?"
                                 header="Confirm" severity="info">
                    <p:commandButton value="Si" icon="ui-icon-check"
                                     actionListener="#{adminAreaCultivo.deleteRiego()}"
                                     process="@this"/>
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="ui-icon-times"
                                     onclick="PF('deleteRiegoDialog').hide()"/>
                </p:confirmDialog>

                <!--Edit Dialog-->
                <p:dialog header="Editar Espacial" showEffect="fade" modal="true"
                          widgetVar="editareaCultivoDialog" width="1000px" height="600px"
                          responsive="true">
                    <p:outputPanel id="edit-areaCultivo-content" class="ui-fluid">
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-area" value="&Aacute;rea: "/><br/>
                                <p:selectOneMenu disabled="true" id="edit-area"
                                                 value="#{adminAreaCultivo.areaSelected}">
                                    <f:selectItems itemLabel="${area.descripcion}" itemValue="${area.id}" var="area"
                                                   value="#{adminAreaCultivo.areaResponsesList}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-cultivo" value="Cultivo: "/><br/>
                                <p:selectOneMenu id="edit-cultivo" disabled="true"
                                                 value="#{adminAreaCultivo.cultivoSelected}">
                                    <f:selectItems itemLabel="${cul.descripcion}" itemValue="${cul.id}" var="cul"
                                                   value="#{adminAreaCultivo.cultivoList}"/>
                                </p:selectOneMenu>
                            </div>
                        </div>
                        <br/>
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-fechaSiembra" value="Fecha de Siembra: "/><br/>
                                <p:datePicker id="edit-fechaSiembra" disabled="true"
                                              value="#{adminAreaCultivo.fechaSiembra}"/>
                            </div>
                            <div class="col col-sm-6">
                                <p:outputLabel for="edit-fechaRecogida" value="Fecha de Recogida: "/><br/>
                                <p:datePicker id="edit-fechaRecogida" value="#{adminAreaCultivo.fechaRecogida}"
                                              required="true"
                                              requiredMessage="La fecha de recogida es obligatoria."
                                              showIcon="true"/>
                            </div>
                        </div>
                        <br/>
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-3">
                                <p:outputLabel for="edit-planProduccion" value="Plan de Producción: "/><br/>
                                <p:inputNumber id="edit-planProduccion" value="#{adminAreaCultivo.planProduccion}"
                                               required="true"
                                               requiredMessage="El plan de producción es obligatorio."
                                               modifyValueOnWheel="false"/>
                            </div>
                            <div class="col col-sm-3">
                                <p:outputLabel for="edit-planPermanente"
                                               value="Producción de cultivos permanentes: "/><br/>
                                <p:inputNumber id="edit-planPermanente" value="#{adminAreaCultivo.prodPermanente}"
                                               modifyValueOnWheel="false"/>
                            </div>
                            <div class="col col-sm-3">
                                <p:outputLabel for="edit-prodTemp" value="Producción de cultivos temporales: "/><br/>
                                <p:inputNumber id="edit-prodTemp" value="#{adminAreaCultivo.prodTemporal}"
                                               modifyValueOnWheel="false"/>
                            </div>
                            <div class="col col-sm-3">
                                <p:outputLabel for="edit-prodReal" value="Producción real: "/><br/>
                                <p:inputNumber id="edit-prodReal" value="#{adminAreaCultivo.prodReal}"
                                               modifyValueOnWheel="false"/>
                            </div>
                            <br/>

                            <div class="row" style="padding-left: 15px; padding-right: 15px">
                                <div class="col col-sm-12">
                                    <p:outputLabel for="edit-pickList" value="Agroquímicos: "/><br/>
                                </div>
                                <div class="col col-sm-12">
                                    <p:pickList id="edit-pickList" value="#{adminAreaCultivo.agroquimicos}" var="a"
                                                itemLabel="#{a}" itemValue="#{a}"/>
                                </div>
                            </div>
                            <br/>
                            <div class="row">
                                <div class="col col-sm-12">
                                    <p:outputLabel for="dt-riego" value="Planificaci&oacute;n de riego: "/>
                                </div>
                                <div class="col col-sm-3">
                                    <p:commandButton value="Adicionar" icon="pi pi-plus"
                                                     update=":dialogs:add-riego-content"
                                                     oncomplete="PF('addRiegoDialog').show()"
                                                     styleClass="ui-button-success" style="margin-right: .5rem">
                                        <p:resetInput target=":dialogs:add-riego-content"/>
                                    </p:commandButton>
                                </div>

                                <div class="col col-sm-12">
                                    <p:dataTable tableStyleClass="table-striped" id="dt-riego1" widgetVar="dtriego"
                                                 var="riego"
                                                 value="#{adminAreaCultivo.riegoResponseList}" size="small"
                                                 reflow="true"
                                                 paginator="true" rows="5"
                                                 paginatorPosition="bottom">
                                        <p:column exportHeaderValue="Planificado" headerText="Planificado">
                                            <h:outputText
                                                    value="${riego.fechaPlanificacion}"/>
                                        </p:column>
                                        <p:column exportHeaderValue="Real" headerText="Real">
                                            <h:outputText
                                                    value="${riego.fechaReal}"/>
                                        </p:column>
                                        <p:column exportable="false">
                                            <p:commandButton icon="pi pi-pencil" update=":dialogs:edit-riego-content"
                                                             style="margin-left: 10px"
                                                             oncomplete="PF('editRiegoDialog').show()"
                                                             styleClass="edit-button rounded-button ui-button-warning"
                                                             process="@this"
                                                             actionListener="#{adminAreaCultivo.updateSelectedRiegoToEdit(riego)}">
                                                <p:resetInput target=":dialogs:edit-riego-content"/>
                                            </p:commandButton>
                                            <p:commandButton icon="pi pi-trash"
                                                             oncomplete="PF('deleteRiegoDialog').show()"
                                                             style="margin-left: 10px"
                                                             styleClass="edit-button rounded-button ui-button-danger"
                                                             process="@this"
                                                             actionListener="#{adminAreaCultivo.updateSelectedRiegoToDelete(riego)}">
                                            </p:commandButton>
                                        </p:column>

                                    </p:dataTable>
                                </div>
                            </div>
                        </div>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         id="btnEditModal" actionListener="#{adminAreaCultivo.editAreaCultivo()}"
                                         update="edit-areaCultivo-content :form:messages"
                                         process="edit-areaCultivo-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('editareaCultivoDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>

                <!--Delete Dialog -->
                <p:confirmDialog widgetVar="deleteAreaCultivoDialog" showEffect="fade" width="300"
                                 message="¿Desea eliminar la AreaCultivo?"
                                 header="Confirm" severity="info">
                    <p:commandButton value="Si" icon="ui-icon-check"
                                     actionListener="#{adminAreaCultivo.deleteAreaCultivo()}"
                                     process="@this"/>
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="ui-icon-times"
                                     onclick="PF('deleteAreaCultivoDialog').hide()"/>
                </p:confirmDialog>
                <input type="hidden"
                       name="${_csrf.parameterName}"
                       value="${_csrf.token}"/>
            </h:form>

        </ui:define>

    </ui:composition>

</h:body>

</html>
