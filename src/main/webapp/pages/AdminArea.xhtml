<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core">

<h:head>
    <title>Title</title>
</h:head>

<h:body>

    <ui:composition template="template.xhtml">

        <ui:define name="title">
            Administrar &Aacute;rea
        </ui:define>

        <ui:define name="content">
            #{adminArea.init()}
            <h:form id="form">
                <p:growl id="messages" showDetail="true"/>

                <script src="https://maps.google.com/maps/api/js?key=AIzaSyCvCDkYieuUBmMWon_mfLAfjuaeuosuqow&amp;sensor=true"></script>
                <p:gmap id="gmap" center="22.9985905,-82.1645741" zoom="16" type="HYBRID"
                        style="width:100%;height:400px"
                        model="#{adminArea.polygonModel}">
                    <p:ajax event="overlaySelect" listener="#{adminArea.onPolygonSelect}" update="messages"/>
                </p:gmap>

                <p:toolbar>
                    <p:toolbarGroup align="right">
                        <p:commandButton value="Importar &Aacute;reas" icon="pi pi-plus"
                                         actionListener="#{adminArea.getAreasToImport()}"
                                         update=":dialogs:add-area-content"
                                         oncomplete="PF('addareaDialog').show()"
                                         styleClass="ui-button-success" style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:add-area-content"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable tableStyleClass="table-striped" id="dt-area" widgetVar="dtarea" var="area"
                             value="#{adminArea.listArea}" size="small"
                             reflow="true"
                             rowKey="#{area.descripcion}" paginator="true" rows="10"
                             paginatorPosition="bottom">
                    <f:facet name="header">
                        <div class="area-table-header">
                        <span class="filter-container ui-input-icon-left"> <i class="pi pi-search"></i>
                        <p:inputText id="globalFilter" onkeyup="PF('dtarea').filter()" placeholder="Buscar"/>
                    </span>
                        </div>
                    </f:facet>
                    <p:column exportHeaderValue="ID" headerText="ID" sortOrder="asc" filterBy="#{area.id}">
                        <h:outputText value="#{area.id}"/>
                    </p:column>
                    <p:column exportHeaderValue="Descripci&oacute;n" headerText="Descripci&oacute;n">
                        <h:outputText value="#{area.descripcion}"/>
                    </p:column>
                    <p:column exportHeaderValue="Capa de importaci&oacute;n" headerText="Capa de importaci&oacute;n">
                        <h:outputText value="#{area.capa}"/>
                    </p:column>
                    <p:column exportable="false">
                        <p:commandButton icon="pi pi-info-circle"
                                         oncomplete="PF('infoareaDialog').show()"
                                         styleClass="rounded-button ui-button-info" process="@this"
                                         actionListener="#{adminArea.updateSelectedArea(area)}"
                                         update=":dialogs:info-area-content"
                                         title="Informaci&oacute;n">
                            <p:resetInput target=":dialogs:info-area-content"/>
                        </p:commandButton>
                        <p:commandButton icon="pi pi-pencil" update=":dialogs:edit-area-content"
                                         style="margin-left: 10px"
                                         oncomplete="PF('editareaDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-warning" process="@this"
                                         actionListener="#{adminArea.updateSelected_Area_toEdit(area)}">
                            <p:resetInput target=":dialogs:edit-area-content"/>
                        </p:commandButton>
                        <!--                        <p:commandButton icon="pi pi-trash"-->
                        <!--                                         oncomplete="PF('deleteAreaDialog').show()"-->
                        <!--                                         style="margin-left: 10px"-->
                        <!--                                         styleClass="edit-button rounded-button ui-button-danger" process="@this"-->
                        <!--                                         actionListener="#{adminArea.updateSelectedAreaToDelete(area)}">-->
                        <!--                        </p:commandButton>-->
                    </p:column>

                </p:dataTable>
                <input type="hidden"
                       name="${_csrf.parameterName}"
                       value="${_csrf.token}"/>
            </h:form>

            <h:form id="dialogs">

                <!--Info Dialog-->
                <p:dialog header="Informaci&oacute;n" showEffect="fade" modal="true"
                          widgetVar="infoareaDialog"
                          responsive="true">
                    <p:outputPanel id="info-area-content" class="ui-fluid">
                        <p:outputPanel>
                            <div class="row">
                                <div class="col col-lg-5">
                                    <strong><h:outputLabel value="ID: "/></strong>
                                </div>
                                <div class="col col-lg-7">
                                    <h:outputText
                                            value="#{adminArea.selectedArea.id}"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-lg-5">
                                    <strong><h:outputLabel value="Descripci&oacute;n: "/></strong>
                                </div>
                                <div class="col col-lg-7">
                                    <h:outputText
                                            value="#{adminArea.selectedArea.descripcion}"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-lg-5">
                                    <strong><h:outputLabel value="Capa de importaci&oacute;n: "/></strong>
                                </div>
                                <div class="col col-lg-7">
                                    <h:outputText
                                            value="#{adminArea.selectedArea.capa}"/>
                                </div>
                            </div>
                            <div class="row">
                                <p:gmap id="gmapInfo" center="#{adminArea.centerCoords}" zoom="16" type="HYBRID"
                                        style="width:400px;height:400px"
                                        model="#{adminArea.polygonModelInfo}">
                                </p:gmap>
                            </div>
                        </p:outputPanel>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('infoareaDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>
                <!--/Info Dialog-->

                <!--Add Dialog-->
                <p:dialog header="Importar &aacute;reas" showEffect="fade" modal="true"
                          widgetVar="addareaDialog"
                          responsive="true">
                    <p:outputPanel id="add-area-content" class="ui-fluid">
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-12">
                                <p:outputLabel for="area" value="&Aacute;rea: "/>
                            </div>
                            <div class="col col-sm-12">
                                <h:panelGroup styleClass="ui-inputgroup">
                                    <p:selectOneMenu id="area" value="#{adminArea.selectedAreaToImport}">
                                        <f:selectItem itemLabel="Seleccione un elemento" itemValue=""/>
                                        <f:selectItems value="#{adminArea.areaImport}"/>
                                    </p:selectOneMenu>
                                    <p:commandButton actionListener="#{adminArea.getAreaInfo()}"
                                                     process="add-area-content @this" icon="pi pi-refresh"
                                                     title="Cargar datos"/>
                                </h:panelGroup>
                            </div>
                        </div>
                        <br/>
                        <div class="row" style="padding-left: 15px; padding-right: 15px">
                            <div class="col col-sm-12">
                                <p:outputPanel id="areaToImportPanel" rendered="#{adminArea.valid}">
                                    <div class="row" style="padding-left: 15px; padding-right: 15px">
                                        <div class="col col-sm-12">
                                            <p:outputLabel for="area" value="&Aacute;reas a importar: "/>
                                            <ui:repeat value="#{adminArea.legend}" var="legend">
                                                <p:chip label="#{legend}"
                                                        style="margin-left: 5px; background: #{adminArea.translateLegendColor(legend)}"/>
                                            </ui:repeat>
                                        </div>
                                    </div>
                                    <br/>
                                    <div class="row" style="padding-left: 15px; padding-right: 15px">
                                        <div class="col col-sm-12">
                                            <center>
                                                <p:gmap id="gmapInfoToImport" center="22.9985905,-82.1645741" zoom="16"
                                                        type="HYBRID"
                                                        style="height:400px"
                                                        model="#{adminArea.polygonModelToImport}">
                                                </p:gmap>
                                            </center>
                                        </div>
                                    </div>
                                </p:outputPanel>
                            </div>
                        </div>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Importar" icon="pi pi-file-import"
                                         id="btnAddModal"
                                         disabled="#{!adminArea.valid}"
                                         update="add-area-content :form:messages dialogs:importAreaDialog"
                                         oncomplete="PF('importAreaDialog').show()"
                                         process="add-area-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('addareaDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>

                <p:confirmDialog id="importAreaDialog" widgetVar="importAreaDialog" showEffect="fade" width="500"
                                 message="¿Seguro que desea importar las &aacute;reas correspondientes a la capa '#{adminArea.selectedAreaToImport}'?"
                                 header="Confirmar importaci&oacute;n" severity="warn">
                    <p:commandButton value="Si" icon="pi pi-check" actionListener="#{adminArea.addArea()}"
                                     process="@this"/>
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                                     onclick="PF('importAreaDialog').hide()"/>
                </p:confirmDialog>
                <!--/Add Dialog-->

                <!--Edit Dialog-->
                <p:dialog header="Editar &Aacute;rea" showEffect="fade" modal="true"
                          widgetVar="editareaDialog"
                          responsive="true">
                    <p:outputPanel id="edit-area-content" class="ui-fluid">
                        <div class="row">
                            <div class="col col-sm-5">
                                <p:outputLabel for="edit-id" value="Identificaci&oacute;n"/><br/>
                                <p:inputText label="Identificaci&oacute;n" style="height: 35px; width: 100%;"
                                             id="edit-id" value="#{adminArea.selectedArea.id}"
                                             placeholder="Identificaci&oacute;n" disabled="true"
                                             mask="99999999999"/>
                            </div>
                        </div>
                        <br/>
                        <div class="row">
                            <div class="col col-sm-12" style="padding-left: 15px; padding-right: 15px">
                                <p:outputLabel for="edit-descripcion" value="Descripci&oacute;n"/><br/>
                                <p:inputTextarea id="edit-descripcion" style="height: 30px;"
                                                 value="#{adminArea.descripcion}"
                                                 validatorMessage="La descripci&oacute;n introducida no es válida">
                                    <f:validateLength maximum="250"/>
                                    <f:validateRegex pattern="[a-zA-Z0-9 áéíóúüñÁÉÍÓÚÜÑ]+$"/>
                                </p:inputTextarea>
                            </div>
                        </div>
                        <br/>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         id="btnEditModal" actionListener="#{adminArea.editArea()}"
                                         update="edit-area-content :form:messages"
                                         process="edit-area-content @this"/>
                        <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('editareaDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>

                <!--Delete Dialog -->
                <p:confirmDialog widgetVar="deleteAreaDialog" showEffect="fade" width="300"
                                 message="¿Desea eliminar la &aacute;rea?"
                                 header="Confirm" severity="info">
                    <p:commandButton value="Si" icon="ui-icon-check" actionListener="#{adminArea.deleteArea()}"
                                     process="@this"/>
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="ui-icon-times"
                                     onclick="PF('deleteAreaDialog').hide()"/>
                </p:confirmDialog>
                <input type="hidden"
                       name="${_csrf.parameterName}"
                       value="${_csrf.token}"/>
            </h:form>

        </ui:define>

    </ui:composition>

</h:body>

</html>
